name: Docker CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t cactros-flask:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ arif346 }}
          password: ${{ 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 }}

      - name: Push Docker image
        run: |
          docker tag cactros-flask:latest ${{ arif346 }}/cactros-flask:latest
          docker push ${{ arif346 }}/cactros-flask:latest
