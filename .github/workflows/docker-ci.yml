name: CI/CD - Flask Docker App

on:
  push:
    branches: ["main", "feat/*"]   # Run on main and feature branches
  pull_request:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}  # set in GitHub Secrets
          password: ${{ secrets.DOCKER_HUB_TOKEN }}     # set in GitHub Secrets

      # 4. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: arif346/flask-docker-demo:latest

  # Optional: Run tests inside container
  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run container and test
        run: |
          docker run --rm arif346/flask-docker-demo
